name: Semantic Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

# Only the latest title matters; an edit supersedes the run still checking the
# previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Grant nothing by default; the one job below narrows to what it needs. Without
# this the token starts from the repository default.
permissions: {}

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # action-semantic-pull-request reads the pull request title.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
